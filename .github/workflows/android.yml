name: Android APK

# Produit un APK installable à chaque push sur main, et à la demande.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json n'est pas versionné dans ce dépôt → install, pas ci.
      - name: Installer les dépendances
        run: npm install

      - name: Reconstituer le .env depuis les secrets
        run: |
          cat > .env <<'ENVFILE'
          REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_TMDB_KEY=${{ secrets.REACT_APP_TMDB_KEY }}
          REACT_APP_RECAPTCHA_KEY=${{ secrets.REACT_APP_RECAPTCHA_KEY }}
          ENVFILE

      - name: Build web
        run: npm run build
        env:
          CI: false   # les warnings ESLint ne doivent pas casser le build

      # Passage par l'environnement plutôt que par `echo '...'` : une apostrophe
      # dans le JSON casserait la ligne de commande, et le contenu n'apparaît
      # jamais dans la trace de la commande.
      - name: Restaurer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: swochi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
